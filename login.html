<!DOCTYPE html>
<html lang="da">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Maximilian Michalskis portfolio med projekter i dansk og mediegrafik.">
        <title>Login · Maximilian Michalski</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js?v=6" defer></script>
    </head>
    <body data-page="login">
        <a class="skip-link" href="#main">Spring til indhold</a>
        <header class="site-header">
            <h1>MAXIMILIAN MICHALSKI</h1>
            <p class="site-subtitle">Portfolio</p>
            <nav aria-label="Hovedmenu">
                <a href="index.html" data-page="home">HOME</a>
                <a href="dansk.html" data-page="dansk">DANSK</a>
                <a href="mediegrafiker.html" data-page="mediegrafiker">MEDIEGRAFIKER</a>
                <a href="login.html" data-auth-link>LOGIN</a>
                <button type="button" class="nav-logout" data-logout hidden>LOG UD</button>
            </nav>
        </header>
        <main id="main" class="container">
            <section class="card login-card">
                <p class="eyebrow">ADMINISTRATOR</p>
                <h2>Login</h2>
                <p>Log ind for at uploade og redigere dine projekter.</p>
                <p id="login-status" class="status" role="status">Forbinder…</p>
                <form id="login-form">
                    <label for="username">Brugernavn</label>
                    <input id="username" name="username" autocomplete="username" maxlength="40" required>
                    <label for="password">Adgangskode</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button class="button" type="submit" id="login-submit" disabled>Log ind</button>
                </form>
                <p class="small muted">Kun portfolioens administrator kan logge ind.</p>
            </section>
        </main>
        <footer class="site-footer">
            <p>© <span data-year>2026</span> Maximilian Michalski · Skoleportfolio</p>
        </footer>
        <noscript>
            <p class="noscript">Aktivér JavaScript for at vise projekter og bruge login.</p>
        </noscript>
    </body>
</html>
